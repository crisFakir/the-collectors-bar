name: User story
description: A piece of value for a user, small enough to finish in one sprint.
title: "[Story] "
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who wants what, and why.
      value: |
        **As a** <actor>
        **I want** <goal>
        **So that** <benefit>
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Conditions that must be true for the story to be done. Prefer Given / When / Then.
      value: |
        - [ ] **Given** <context> **When** <action> **Then** <result>
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirements
      description: IDs from docs/requirements.md covered by this story.
      placeholder: e.g. CHK-02, NFR-CONS-01
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Designs, technical notes, open questions.
